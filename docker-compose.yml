services:
  openepg-fix:
    build: .
    container_name: openepg-fix
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SOURCE_URL: "https://www.open-epg.com/app/pdownload.php?file=yourID.xml"
      TZ: "America/Toronto"
      RUN_AT: "04:00"
      # Optional: regexes (matched on title) for shows to always / never treat as series.
      # Separate multiple patterns with ";;"
      # FORCE_SERIES: "^CTV National News;;^CTV News;;^Global News"
      # NEVER_SERIES: "^Movie"
    volumes:
      - openepg_fix:/data

volumes:
  openepg_fix:
